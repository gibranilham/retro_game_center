<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro Game Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="home-shell" aria-labelledby="page-title">
    <header class="home-header">
      <p class="kicker">Pocket Arcade Library</p>
      <h1 id="page-title">GAME CENTER</h1>
      <p class="subtitle">SELECT A GAME</p>
    </header>

    <section class="game-grid" aria-label="Game selection">
      <a class="game-card game-card-active" href="games/snake.html" aria-label="Play Snake">
        <span class="game-icon game-icon-snake" aria-hidden="true">S</span>
        <span class="game-title">SNAKE</span>
        <span class="game-meta">READY</span>
        <span class="active-dot" aria-hidden="true"></span>
      </a>

      <article class="game-card game-card-soon" aria-label="Tetris coming soon">
        <span class="coming-badge">SOON</span>
        <span class="game-icon game-icon-blocks" aria-hidden="true"></span>
        <span class="game-title">TETRIS</span>
        <span class="game-meta">LOCKED</span>
      </article>

      <article class="game-card game-card-soon" aria-label="Space Invaders coming soon">
        <span class="coming-badge">SOON</span>
        <span class="game-icon game-icon-invader" aria-hidden="true"></span>
        <span class="game-title">INVADERS</span>
        <span class="game-meta">LOCKED</span>
      </article>

      <article class="game-card game-card-soon" aria-label="Breakout coming soon">
        <span class="coming-badge">SOON</span>
        <span class="game-icon game-icon-bricks" aria-hidden="true"></span>
        <span class="game-title">BREAKOUT</span>
        <span class="game-meta">LOCKED</span>
      </article>

      <article class="game-card game-card-soon" aria-label="Pac-Man coming soon">
        <span class="coming-badge">SOON</span>
        <span class="game-icon game-icon-pac" aria-hidden="true"></span>
        <span class="game-title">PAC-MAN</span>
        <span class="game-meta">LOCKED</span>
      </article>

      <article class="game-card game-card-soon" aria-label="Mystery game coming soon">
        <span class="coming-badge">SOON</span>
        <span class="game-icon game-icon-slot" aria-hidden="true">?</span>
        <span class="game-title">SLOT 06</span>
        <span class="game-meta">EMPTY</span>
      </article>
    </section>
  </main>
</body>
</html>
